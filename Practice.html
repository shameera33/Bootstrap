<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>prctc</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script></head>
</head>

<body>

<div class="container">

<h2 class="text-center">Feedback Form</h2>

<form>

<div class="form-group">
<label for="name">Name</label>
<input type="text" class="form-control" id="name" placeholder="Enter your name">
</div>

<div class="form-group">
<label for="email">Email</label>
<input type="email" class="form-control" id="email" placeholder="Enter your email">
</div>

<div class="form-group">
<label for="feedback">Feedback</label>
<textarea class="form-control" id="feedback" rows="3" placeholder="Enter your feedback"></textarea>
</div>

<div class="form-group">
<label>Preferred Contact Method</label>

<div class="form-check">
<input type="radio" class="form-check-input" name="contact" id="contactEmail">
<label class="form-check-label" for="contactEmail">Email</label>
</div>

<div class="form-check">
<input type="radio" class="form-check-input" name="contact" id="contactPhone">
<label class="form-check-label" for="contactPhone">Phone</label>
</div>

</div>

<div class="form-group">
<label for="satisfaction">Overall Satisfaction</label>
<input type="range" class="form-control-range w-25" id="satisfaction" min="1" max="10">
</div>

<div class="form-group">
<label for="order">Type of Order</label>

<div class="dropdown">

<button type="button" id="order" class="btn btn-info btn-sm dropdown-toggle" data-toggle="dropdown">
Choose an order
</button>

<div class="dropdown-menu">
<a class="dropdown-item" href="#">Cake</a>
<a class="dropdown-item" href="#">Cookies</a>
<a class="dropdown-item" href="#">Pastries</a>
</div>

</div>

</div>

<button type="submit" class="btn btn-primary btn-sm">Submit</button>

</form>

</div>

</body>
</html>
