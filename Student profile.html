<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student profile</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="row">
            <h1 class="display-2 text-warning">Student Profile</h1>
        </div>

        <div class="row">
            <blockquote class="blockquote text-danger col-sm-12" style="margin-top: 12px; font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;"><i>Learning never exhausts the mind</i></blockquote>
            <img src="https://upload.wikimedia.org/wikipedia/commons/8/89/Portrait_Placeholder.png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" class="rounded-circle mx-auto d-block" width="200" height="200" alt="Profile image">
        </div>

            <table class="table table-striped" style="margin-top:100px;">
                <thead class="bg-dark text-white">
                    <tr>
                    <th>Subjects</th>
                    <th>Marks</th>
                </tr>
                </thead>
                <tr class="text-primary">
                    <td>English</td>
                    <td>50</td>
                </tr>
                <tr class="text-primary">
                    <td>Maths</td>
                    <td>45</td>
                </tr>
                <tr class="text-primary">
                    <td>Malayalam</td>
                    <td>40</td>
                </tr>
            </table>

        <div class="alert alert-success">Profile updated <strong>successfully!</strong></div>

        </div>
    </div>
</body>
</html>
