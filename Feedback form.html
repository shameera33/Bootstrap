<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback form</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.0/js/bootstrap.min.js"></script></head>
</head>
<body>
    <div class="container">

      <h2 class="text-center">Feedback Form</h2>
    <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" class="form-control" id="name" name="names" placeholder="Enter name" required>
    </div>

    <div class="form-group">
        <label for="email">Email:</label>
        <input type="email" class="form-control" id="email" name="email" placeholder="Enter email" required>
    </div>

    <div class="form-group">
  <label for="comment">Feedback:</label>
  <textarea class="form-control" rows="4" id="comment" placeholder="Write your feedback" required></textarea>
</div>

<label for="find">How did you found our site:</label>

<div class ="dropdown">
<button type="button" id="find" class="btn btn-info dropdown-toggle btn-sm" data-toggle="dropdown">Select</button>
<div class="dropdown-menu">
<a class="dropdown-item" href="#">Google Search</a>
<a class="dropdown-item" href="#">Social Media</a>
<a class="dropdown-item" href="#">Advertisement</a>
<a class="dropdown-item" href="#">Other</a>
</div>
</div>

<label class="mt-4">Overall Satisfaction</label>
<div class="form-check">
  <label class="form-check-label">
    <input type="radio" class="form-check-input "name="optradio">1
  </label>
</div>

<div class="form-check">
  <label class="form-check-label">
    <input type="radio" class="form-check-input"name="optradio" >2
  </label>
</div>

<div class="form-check disabled">
  <label class="form-check-label">
    <input type="radio" class="form-check-input" name="optradio">3
  </label>
</div>

<div class="form-check disabled">
  <label class="form-check-label">
    <input type="radio" class="form-check-input" name="optradio">4
  </label>
</div>

<div class="form-check disabled">
  <label class="form-check-label">
    <input type="radio" class="form-check-input" name="optradio">5
  </label>
</div>

<button type="button" class="btn btn-info mt-4 btn-sm">Submit</button>

    </div>
</body>
</html>
